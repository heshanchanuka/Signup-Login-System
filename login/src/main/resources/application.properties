spring.application.name=login
server.port=8083

# Database configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/loginDB?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# Hibernate / JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT configuration
jwt.secret=zephyratech_secret_key_which_is_very_secure_and_at_least_512_bits_long_for_hs512_algorithm_1234567890
jwt.validity-seconds=18000
